name: Update LinkedIn

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install puppeteer@24

      - name: Generate LinkedIn
        run: node scripts/generate-linkedin.mjs

      - name: Commit changes
        run: |
          git config user.name "BosEriko"
          git config user.email "bos@eriko.ph"
          git add linkedin/EXPERIENCE.md linkedin/banner.png
          git commit -m ":memo: Update LinkedIn" || echo ":memo: No changes"
          git push
