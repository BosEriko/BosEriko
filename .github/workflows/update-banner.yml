name: Update Banner

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install puppeteer@24

      - name: Generate banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-banner.mjs

      - name: Commit changes
        run: |
          git config user.name "BosEriko"
          git config user.email "bos@eriko.ph"
          git add banner.png README.md
          git commit -m ":art: Update banner" || echo ":art: No changes"
          git push
