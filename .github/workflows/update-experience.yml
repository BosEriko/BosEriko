name: Update Experience

permissions:
  contents: write

on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate experience
        run: node scripts/generate-experience.mjs

      - name: Commit changes
        run: |
          git config user.name "BosEriko"
          git config user.email "bos@eriko.ph"
          git add EXPERIENCE.md
          git commit -m ":memo: Update experience" || echo ":memo: No changes"
          git push
